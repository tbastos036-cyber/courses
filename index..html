<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Liste Courses</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); font-family:'Sora',sans-serif; color:#f1f5f9; min-height:100vh; max-width:430px; margin:0 auto; }
::-webkit-scrollbar { display:none; }

.header { padding:28px 20px 0; }
.header-sub { font-size:11px; font-weight:600; letter-spacing:3px; color:#64748b; margin-bottom:4px; }
.header-title { font-size:26px; font-weight:800; letter-spacing:-1px; }

.tabs { display:flex; gap:8px; margin:16px 20px 0; background:#1e293b; border-radius:14px; padding:4px; }
.tab { flex:1; padding:10px 0; border-radius:10px; background:transparent; border:none; color:#64748b; font-weight:700; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; transition:all 0.2s; }
.tab.active { background:linear-gradient(135deg,#3b82f6,#6366f1); color:white; box-shadow:0 4px 12px rgba(99,102,241,0.4); }

.actions { display:flex; gap:8px; padding:14px 20px 8px; }
.btn { flex:1; padding:11px 0; border:none; border-radius:12px; color:white; font-weight:700; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; transition:all 0.2s; }
.btn-scan { background:linear-gradient(135deg,#10b981,#06b6d4); box-shadow:0 4px 12px rgba(16,185,129,0.25); }
.btn-scan.active { background:#ef4444; }
.btn-reset { background:#334155; color:#94a3b8; }
.btn-clear { background:#334155; color:#fb7185; flex:0; padding:11px 14px; }

.search-bar { margin:0 20px 10px; }
.search-bar input { width:100%; background:#1e293b; border:1px solid #334155; border-radius:12px; padding:11px 16px; color:white; font-size:14px; font-family:'Sora',sans-serif; outline:none; }
.search-bar input::placeholder { color:#475569; }

/* SCANNER */
#scanner-wrap { margin:0 20px 12px; border-radius:16px; overflow:hidden; position:relative; background:#000; display:none; }
#scanner-wrap.visible { display:block; }
#interactive video { width:100%; display:block; max-height:220px; object-fit:cover; }
#interactive canvas { display:none; }
.scan-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.scan-box { width:220px; height:100px; border:3px solid #10b981; border-radius:12px; box-shadow:0 0 0 9999px rgba(0,0,0,0.5); position:relative; }
.scan-line { position:absolute; left:4px; right:4px; height:2px; background:#10b981; top:0; animation:scanline 1.5s ease-in-out infinite; }
@keyframes scanline { 0%{top:0} 50%{top:94px} 100%{top:0} }
.scan-label { position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#10b981; font-weight:600; font-size:12px; }

/* SCAN RESULT */
.scan-result { margin:0 20px 12px; background:#1e293b; border-radius:16px; padding:16px; border:1px solid #10b981; display:none; }
.scan-result.visible { display:block; }
.sr-sub { font-size:11px; color:#64748b; margin-bottom:3px; }
.sr-name { font-weight:700; font-size:15px; margin-bottom:2px; }
.sr-info { font-size:11px; color:#10b981; margin-bottom:10px; }
.sr-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.sr-row select { flex:1; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:9px 12px; color:white; font-family:'Sora',sans-serif; font-size:13px; outline:none; }
.sr-btns { display:flex; gap:8px; }
.btn-add-scan { flex:1; padding:10px 0; background:linear-gradient(135deg,#10b981,#06b6d4); border:none; border-radius:10px; color:white; font-weight:700; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; }
.btn-dismiss { padding:10px 14px; background:#334155; border:none; border-radius:10px; color:#94a3b8; font-weight:600; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; }

.list { padding:0 20px 130px; }

/* SECTION */
.section-header { display:flex; align-items:center; justify-content:space-between; padding:10px 0 5px; }
.section-title { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
.btn-add-cat { background:none; border:none; color:#475569; font-size:20px; cursor:pointer; padding:0 4px; line-height:1; font-weight:300; }
.btn-add-cat:hover { color:#94a3b8; }

/* ADD IN CAT */
.add-in-cat { display:none; background:#0f172a; border-radius:12px; padding:10px; margin-bottom:8px; border:1px solid #334155; }
.add-in-cat.visible { display:flex; gap:8px; }
.add-in-cat input { flex:1; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:9px 12px; color:white; font-size:13px; font-family:'Sora',sans-serif; outline:none; }
.btn-add-confirm { padding:9px 14px; background:linear-gradient(135deg,#f59e0b,#f97316); border:none; border-radius:8px; color:white; font-weight:700; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; }

/* ITEM */
.item { display:flex; align-items:center; gap:9px; background:#1e293b; border-radius:14px; padding:10px 11px; margin-bottom:7px; border:1px solid #334155; transition:all 0.2s; position:relative; }
.item.zero { opacity:0.35; }
.item.done { background:#0f172a; border-color:#1e293b; opacity:0.45; }
.item.dragging { opacity:0.4; border:2px dashed #6366f1; }
.item.drag-over { border:2px solid #10b981; background:#0f2820; }

.drag-handle { color:#334155; font-size:16px; cursor:grab; padding:0 2px; flex-shrink:0; user-select:none; touch-action:none; }
.drag-handle:active { cursor:grabbing; color:#64748b; }

.check-btn { width:24px; height:24px; border-radius:7px; flex-shrink:0; background:transparent; border:2px solid #475569; cursor:pointer; display:flex; align-items:center; justify-content:center; color:white; font-size:13px; transition:all 0.15s; }
.check-btn.checked { background:#10b981; border-color:#10b981; }

.item-info { flex:1; min-width:0; cursor:pointer; }
.item-name { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item.done .item-name { text-decoration:line-through; color:#475569; }
.item-cat-badge { font-size:10px; margin-top:2px; font-weight:600; }

.qty-ctrl { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.qty-btn { width:26px; height:26px; border-radius:8px; border:none; background:#334155; color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; line-height:1; }
.qty-num { font-size:14px; font-weight:700; min-width:18px; text-align:center; }
.qty-num.zero { color:#475569; }

.del-btn { background:none; border:none; color:#334155; font-size:18px; cursor:pointer; padding:0 2px; flex-shrink:0; }
.del-btn:hover { color:#fb7185; }

/* MOVE MODAL */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:flex-end; justify-content:center; }
.modal-overlay.visible { display:flex; }
.modal { background:#1e293b; border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:430px; max-height:70vh; overflow-y:auto; }
.modal-title { font-weight:700; font-size:15px; margin-bottom:14px; }
.modal-cat-btn { display:block; width:100%; padding:12px 16px; background:#0f172a; border:1px solid #334155; border-radius:12px; color:white; font-family:'Sora',sans-serif; font-weight:600; font-size:13px; cursor:pointer; margin-bottom:8px; text-align:left; transition:all 0.15s; }
.modal-cat-btn:hover { border-color:#6366f1; }
.modal-close { display:block; width:100%; padding:12px; background:#334155; border:none; border-radius:12px; color:#94a3b8; font-family:'Sora',sans-serif; font-weight:600; font-size:13px; cursor:pointer; margin-top:4px; }

/* BOTTOM */
.bottom-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:linear-gradient(0deg,#0f172a 60%,transparent); padding:16px 20px 28px; display:flex; justify-content:space-between; align-items:flex-end; }
.bottom-label { font-size:11px; color:#64748b; font-weight:600; }
.bottom-count { font-weight:800; font-size:22px; }
.bottom-count span { font-size:12px; font-weight:400; color:#64748b; margin-left:5px; }
.btn-clear-done { background:linear-gradient(135deg,#ef4444,#f97316); border:none; border-radius:12px; padding:10px 14px; color:white; font-weight:700; font-size:12px; cursor:pointer; font-family:'Sora',sans-serif; }

.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#10b981; color:white; padding:10px 22px; border-radius:50px; font-weight:600; font-size:13px; z-index:9999; box-shadow:0 8px 24px rgba(0,0,0,0.4); animation:fadeDown 0.25s ease; white-space:nowrap; }
.toast.error { background:#ef4444; }
@keyframes fadeDown { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
.empty { text-align:center; padding:50px 0; color:#334155; }
.empty-icon { font-size:44px; margin-bottom:10px; }

.cats-bar { display:flex; gap:7px; padding:12px 20px 4px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.cats-bar::-webkit-scrollbar { display:none; }
.cat-chip { flex-shrink:0; padding:7px 13px; border-radius:20px; border:1.5px solid; background:transparent; font-family:'Sora',sans-serif; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.18s; opacity:0.55; }
.cat-chip.active { opacity:1; }
.cat-chip-add { flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1.5px dashed #475569; background:transparent; color:#64748b; font-size:20px; font-weight:300; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.18s; line-height:1; }
.cat-chip-add:hover { border-color:#94a3b8; color:#94a3b8; }
.newcat-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:flex-end; justify-content:center; }
.newcat-overlay.visible { display:flex; }
.newcat-modal { background:#1e293b; border-radius:20px 20px 0 0; padding:24px 20px; width:100%; max-width:430px; }
.newcat-title { font-weight:700; font-size:15px; margin-bottom:16px; }
.newcat-input { width:100%; background:#0f172a; border:1px solid #334155; border-radius:12px; padding:13px 16px; color:white; font-size:14px; font-family:'Sora',sans-serif; outline:none; margin-bottom:12px; }
.newcat-colors { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:16px; }
.color-dot { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all 0.15s; }
.color-dot.selected { border-color:white; transform:scale(1.15); }
.newcat-btns { display:flex; gap:8px; }
.btn-newcat-ok { flex:1; padding:12px; background:linear-gradient(135deg,#3b82f6,#6366f1); border:none; border-radius:12px; color:white; font-weight:700; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; }
.btn-newcat-cancel { padding:12px 18px; background:#334155; border:none; border-radius:12px; color:#94a3b8; font-weight:600; font-size:13px; cursor:pointer; font-family:'Sora',sans-serif; }
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">MES COURSES</div>
  <div class="header-title">🛒 Liste Maison</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchMarket(0)">Aldi</button>
  <button class="tab" onclick="switchMarket(1)">Colruyt</button>
</div>

<!-- CATEGORIES BAR -->
<div class="cats-bar" id="cats-bar"></div>

<div class="actions">
  <button class="btn btn-scan" id="btn-scan" onclick="toggleScan()">📷 Scanner</button>
  <button class="btn btn-reset" onclick="resetQtysToZero()">⬜ Remettre qtés à 0</button>
  <button class="btn btn-clear" onclick="clearDone()">🗑️</button>
</div>

<!-- SCANNER -->
<div id="scanner-wrap">
  <div id="interactive" class="viewport"></div>
  <div class="scan-overlay"><div class="scan-box"><div class="scan-line"></div></div></div>
  <div class="scan-label">📦 Pointez le code-barres</div>
</div>

<!-- SCAN RESULT -->
<div class="scan-result" id="scan-result">
  <div class="sr-sub">Produit détecté</div>
  <div class="sr-name" id="sr-name"></div>
  <div class="sr-info" id="sr-info"></div>
  <div class="sr-row">
    <select id="sr-market">
      <option value="0">Aldi</option>
      <option value="1">Colruyt</option>
    </select>
    <select id="sr-cat"></select>
  </div>
  <div class="sr-btns">
    <button class="btn-add-scan" onclick="confirmScan()">✅ Ajouter</button>
    <button class="btn-dismiss" onclick="dismissScan()">✕</button>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="🔍 Rechercher..." oninput="renderList()">
</div>

<div class="list" id="list"></div>

<!-- NEW CATEGORY MODAL -->
<div class="newcat-overlay" id="newcat-modal">
  <div class="newcat-modal">
    <div class="newcat-title">➕ Nouvelle catégorie</div>
    <input class="newcat-input" id="newcat-input" placeholder="Nom de la catégorie..." onkeydown="if(event.key==='Enter')confirmNewCat()">
    <div class="newcat-colors" id="newcat-colors"></div>
    <div class="newcat-btns">
      <button class="btn-newcat-cancel" onclick="closeNewCat()">Annuler</button>
      <button class="btn-newcat-ok" onclick="confirmNewCat()">Créer</button>
    </div>
  </div>
</div>

<!-- MOVE MODAL -->
<div class="modal-overlay" id="move-modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">🔀 Déplacer vers...</div>
    <div id="modal-cats"></div>
    <button class="modal-close" onclick="closeModal()">Annuler</button>
  </div>
</div>

<div class="bottom-bar">
  <div>
    <div class="bottom-label" id="bottom-market">Aldi</div>
    <div class="bottom-count"><span id="bottom-active">0</span>/<span id="bottom-total">0</span><span>à acheter</span></div>
  </div>
  <button class="btn-clear-done" onclick="clearDone()">Supprimer achetés</button>
</div>

// ---- SCANNER ----
function toggleScan() { scanning ? stopScan() : startScan(); }

function startScan() {
  document.getElementById('scanner-wrap').classList.add('visible');
  document.getElementById('btn-scan').classList.add('active');
  document.getElementById('btn-scan').textContent = '⏹ Stop';
  scanning = true;
  // pre-fill scan market select
  document.getElementById('sr-market').value = activeMarket;
  // fill cat select
  fillSrCat();

  Quagga.init({
    inputStream:{ name:"Live", type:"LiveStream", target:document.getElementById('interactive'), constraints:{ facingMode:"environment", width:{min:640}, height:{min:480} } },
    decoder:{ readers:["ean_reader","ean_8_reader","code_128_reader","upc_reader"] },
    locate:true
  }, err => {
    if(err){ showToast("❌ Caméra non accessible","error"); stopScan(); return; }
    Quagga.start();
  });

  Quagga.onDetected(result => {
    const code = result.codeResult.code;
    const now = Date.now();
    if(code===lastBarcode && now-lastBarcodeTime<3000) return;
    lastBarcode = code; lastBarcodeTime = now;
    stopScan();
    lookupBarcode(code);
  });
}

function stopScan() {
  scanning = false;
  try { Quagga.stop(); } catch(e){}
  document.getElementById('scanner-wrap').classList.remove('visible');
  document.getElementById('btn-scan').classList.remove('active');
  document.getElementById('btn-scan').textContent = '📷 Scanner';
}

function fillSrCat() {

async function lookupBarcode(code) {
  showToast("🔍 Recherche...");
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const data = await res.json();
    if(data.status===1) {
      const p = data.product;
      const name = p.product_name_fr || p.product_name || `Article ${code.slice(-6)}`;
      const cat = mapCat(p.categories_tags||[]);
      pendingScan = {name, cat, barcode:code};
    } else {
      pendingScan = {name:`Article ${code.slice(-6)}`, cat:"Autre", barcode:code};
    }
  } catch(e) {
    pendingScan = {name:`Article ${code.slice(-6)}`, cat:"Épicerie", barcode:code};
  }
  showScanResult();
}

function mapCat(tags) {
  const s = tags.join(' ').toLowerCase();
  if(s.includes('lait')||s.includes('yaourt')||s.includes('yogurt')) return 'Frigo';
  if(s.includes('fromage')) return 'Frigo';
  if(s.includes('boisson')||s.includes('eau')||s.includes('soda')||s.includes('jus')) return 'Bebidas';
  if(s.includes('charcuterie')||s.includes('jambon')||s.includes('saucisse')) return 'Carne/Charc';
  if(s.includes('surgel')) return 'Congelados';
  if(s.includes('fruit')||s.includes('legume')||s.includes('légume')) return 'Frutas/Legumes';
  if(s.includes('cereale')||s.includes('confiture')||s.includes('petit-dejeuner')) return 'Pequeno Almoço';
  if(s.includes('farine')||s.includes('sucre')||s.includes('epice')) return 'Especiarias/Bolos';
  return 'Acompanhamentos';
}

// ---- DRAG & DROP (touch + mouse) ----
let dragId = null;
let dragOverId = null;

function onDragStart(e, id) {
  dragId = id;
  setTimeout(()=>{ const el = document.getElementById('item-'+id); if(el) el.classList.add('dragging'); },0);
  if(e.dataTransfer) e.dataTransfer.effectAllowed='move';
}
function onDragOver(e, id) {
  e.preventDefault();
  if(id===dragId) return;
  document.querySelectorAll('.item').forEach(el=>el.classList.remove('drag-over'));
  const el = document.getElementById('item-'+id);
  if(el) el.classList.add('drag-over');
  dragOverId = id;
}
function onDrop(e, id) {
  e.preventDefault();
  if(dragId===null||dragId===id) return;
  const arr = lists[activeMarket];
  const fromIdx = arr.findIndex(i=>i.id===dragId);
  const toIdx = arr.findIndex(i=>i.id===id);
  if(fromIdx<0||toIdx<0) return;
  const [moved] = arr.splice(fromIdx,1);
  // Also match category of drop target
  moved.cat = arr[toIdx<fromIdx?toIdx:toIdx].cat;
  arr.splice(toIdx<fromIdx?toIdx:toIdx,0,moved);
  save(); dragId=null; dragOverId=null; renderList();
}
function onDragEnd() {
  document.querySelectorAll('.item').forEach(el=>{ el.classList.remove('dragging'); el.classList.remove('drag-over'); });
  dragId=null; dragOverId=null;
}

// Touch drag
let touchDragId = null;
let touchClone = null;
let touchOffX = 0, touchOffY = 0;

function onTouchStart(e, id) {
  if(e.touches.length>1) return;
  touchDragId = id;
  const el = document.getElementById('item-'+id);
  const rect = el.getBoundingClientRect();
  touchOffX = e.touches[0].clientX - rect.left;
  touchOffY = e.touches[0].clientY - rect.top;
  touchClone = el.cloneNode(true);
  touchClone.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.8;z-index:9998;pointer-events:none;border:2px solid #6366f1;`;
  document.body.appendChild(touchClone);
  el.classList.add('dragging');
}
function onTouchMove(e) {
  if(!touchDragId) return;
  e.preventDefault();
  const x = e.touches[0].clientX - touchOffX;
  const y = e.touches[0].clientY - touchOffY;
  if(touchClone) { touchClone.style.left=x+'px'; touchClone.style.top=y+'px'; }
  // Find element under touch
  touchClone.style.display='none';
  const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  touchClone.style.display='';
  const itemEl = el && el.closest('.item');
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('drag-over'));
  if(itemEl) { const overId = parseInt(itemEl.id.replace('item-','')); if(overId!==touchDragId) itemEl.classList.add('drag-over'); }
}
function onTouchEnd(e) {
  if(!touchDragId) return;
  if(touchClone) { touchClone.remove(); touchClone=null; }
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('dragging'));
  const el = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  const itemEl = el && el.closest('.item');
  if(itemEl) {
    const toId = parseInt(itemEl.id.replace('item-',''));
    if(toId && toId!==touchDragId) {
      const arr = lists[activeMarket];
      const fromIdx = arr.findIndex(i=>i.id===touchDragId);
      const toIdx = arr.findIndex(i=>i.id===toId);
      if(fromIdx>=0&&toIdx>=0) {
        const [moved] = arr.splice(fromIdx,1);
        moved.cat = arr[toIdx<fromIdx?toIdx:toIdx].cat;
        arr.splice(toIdx<fromIdx?toIdx:toIdx,0,moved);
        save();
      }
    }
  }
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('drag-over'));
  touchDragId=null;
  renderList();
}

// ---- CATS BAR ----
let activeCatFilter = null;

function renderCatsBar() {
  const cats = [...new Set(lists[activeMarket].map(i=>i.cat))];
  const bar = document.getElementById('cats-bar');
  let html = '';
  cats.forEach(cat => {
    const color = CAT_COLORS[cat]||'#94a3b8';
    const isActive = activeCatFilter===cat;
    html += `<button class="cat-chip${isActive?' active':''}" style="color:${color};border-color:${color};${isActive?`background:${color}20`:''}" onclick="filterByCat('${cat.replace(/'/g,"\\'")}')">
      ${cat}
    </button>`;
  });
  html += `<button class="cat-chip-add" onclick="openNewCat()" title="Ajouter une catégorie">＋</button>`;
  bar.innerHTML = html;
}

function filterByCat(cat) {
  activeCatFilter = activeCatFilter===cat ? null : cat;
  renderCatsBar();
  renderList();
}


function renderList() {
  const current = lists[activeMarket];
  const search = document.getElementById('search').value.toLowerCase();

  const filtered = current.filter(i => {
    const matchSearch = !search || i.name.toLowerCase().includes(search);
    const matchCat = !activeCatFilter || i.cat===activeCatFilter;
    return matchSearch && matchCat;
  });

  // Group by cat preserving insertion order
  const groups = {};
  filtered.forEach(item => {
    if(!groups[item.cat]) groups[item.cat]=[];
    groups[item.cat].push(item);
  });

  // Stats
  const active = current.filter(i=>i.qty>0&&!i.done).length;
  const total = current.filter(i=>i.qty>0).length;
  document.getElementById('bottom-active').textContent = active;
  document.getElementById('bottom-total').textContent = total;

  const listEl = document.getElementById('list');
  if(!filtered.length) {
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div style="font-weight:600;color:#475569">Aucun article</div></div>`;
    return;
  }

  let html = '';
  Object.entries(groups).forEach(([cat, items]) => {
    const color = CAT_COLORS[cat]||'#94a3b8';
    const isOpen = openAddCat===cat;
    html += `<div class="section-header">
      <span class="section-title" style="color:${color}">${cat}</span>
      <button class="btn-add-cat" onclick="toggleAddCat('${cat.replace(/'/g,"\\'")}')">＋</button>
    </div>`;
    html += `<div class="add-in-cat${isOpen?' visible':''}" id="add-form-${cat}">
      <input id="add-input-${cat}" placeholder="Nom de l'article..." onkeydown="if(event.key==='Enter')confirmAddCat('${cat.replace(/'/g,"\\'")}')">
      <button class="btn-add-confirm" onclick="confirmAddCat('${cat.replace(/'/g,"\\'")}')">OK</button>
    </div>`;
    items.forEach(item => {
      html += `<div class="item${item.done?' done':''}${item.qty===0&&!item.done?' zero':''}" id="item-${item.id}"
        draggable="true"
        ondragstart="onDragStart(event,${item.id})"
        ondragover="onDragOver(event,${item.id})"
        ondrop="onDrop(event,${item.id})"
        ondragend="onDragEnd()">
        <span class="drag-handle"
          ontouchstart="onTouchStart(event,${item.id})"
          ontouchmove="onTouchMove(event)"
          ontouchend="onTouchEnd(event)"
          style="touch-action:none">⠿</span>
        <button class="check-btn${item.done?' checked':''}" onclick="toggleDone(${item.id})">${item.done?'✓':''}</button>
        <div class="item-info" onclick="openMoveModal(${item.id})">
          <div class="item-name">${item.name}</div>
          <div class="item-cat-badge" style="color:${color}">↔ changer catégorie</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-num${item.qty===0?' zero':''}">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},+1)">+</button>
        </div>
        <button class="del-btn" onclick="deleteItem(${item.id})">×</button>
      </div>`;
    });
  });

  listEl.innerHTML = html;
}
